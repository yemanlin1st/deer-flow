schema: pefy.metaflow.omega.config.v1
runtime_id: pefy_metaflow_omega
status: controlled-engineering

parent_system:
  name: MƐTAPEFYON Ω
  organization: GROUP PEFY-CONSULTING GLOBAL

runtime:
  primary_adapter: deerflow
  adapter_is_replaceable: true
  production_self_mutation: false
  unknown_tools: deny
  least_privilege: true
  sandbox_first: true
  default_mode: STANDARD

challenge:
  policy: all
  counsellors:
    - Strategy & Growth
    - IMS & Operations
    - Finance & Cash
    - Digital, Data & Cyber
    - Brand, IP & Customer
  councils:
    - Security & Governance
    - Deep Loop
    - Strategy
    - Quality & Delivery
    - Data & Intelligence
    - Finance & Value
    - Legal & IP
    - GitOps & Release
    - R&D / Product
    - Executive & War Room
    - Knowledge & Evidence
    - Language & Communications
    - Impact
  depth_by_mode:
    FLASH: compact
    STANDARD: compact
    PRO: full
    ULTRA: adversarial
    SOVEREIGN: adversarial
    WARROOM: adversarial

memory:
  tenant_isolation: required
  project_isolation: required
  minimum_necessary_context: true
  authoritative_record: governed-core-store
  semantic_backend: omega-vector-rs
  project_vault_backend: ${PEFY_PROJECT_VAULT_BACKEND:-not-configured}
  core_store_backend: ${PEFY_CORE_STORE_BACKEND:-not-configured}
  duplicate_full_payloads_in_vector_index: false
  return_evidence_handles_before_full_payloads: true
  vector_index:
    engine: omega-vector-rs
    language: rust
    rust_toolchain: 1.97.1
    storage: mmap
    search_representation: int8-normalized
    rerank_representation: f16-normalized
    graph_links: u32-fixed-width
    external_ids: u64
    max_neighbors: 12
    initial_capacity: 4096
    ef_construction: 96
    ef_search: 80
    rerank_candidates: 48
    query_memory_budget_mb: 8
    max_results: 12
    max_excerpt_chars: 1200
    metadata_in_vector_index: false
    mmap_prepopulate: false
    batch_flush: true
    production_rss_limit_required: true
    production_cgroup_or_systemd_memory_limit_required: true
  context_budget:
    prefer_references_over_payload_duplication: true
    max_semantic_results: 12
    max_excerpt_chars_per_result: 1200
    deduplicate_by_evidence_ref: true
    hydrate_full_payload_only_when_required: true

model_routing:
  provider_lock_in: false
  prefer_private_runtime_for_restricted_data: true
  dimensions:
    - capability_fit
    - latency
    - cost
    - sensitivity
    - data_residency
    - context_window
    - tool_use_quality
    - local_availability
    - benchmark_score
    - provider_health

humanization:
  enabled: true
  remove_zero_width: true
  remove_generic_chatbot_residue: true
  normalize_whitespace: true
  preserve_required_disclosure: true
  remove_citations: false
  remove_required_provenance: false

release:
  classes:
    - PRIVATE_WORKING
    - INTERNAL_CONFIDENTIAL
    - RESTRICTED_CLIENT
    - PUBLIC_NEUTRALIZED
  default: PRIVATE_WORKING

consequential_actions:
  require_explicit_owner_approval: true
  blocked_without_approval:
    - write
    - delete
    - send
    - payment
    - signature
    - secret_access
    - production_deploy
    - account_wide_change
    - external_publish

observability:
  enabled: true
  redact_secrets: true
  memory_metrics:
    - vector_index_count
    - vector_index_logical_bytes
    - vector_index_mapped_virtual_bytes
    - vector_index_bytes_per_vector
    - vector_query_budget_bytes
    - process_rss_bytes
    - page_faults
    - retrieval_latency_ms
    - retrieval_recall_at_k
  evidence_events:
    - mission.routed
    - memory.retrieved
    - memory.vector.stats
    - council.challenge.completed
    - task.dispatched
    - artifact.produced
    - evidence.verified
    - humanization.completed
    - release.gated
    - mission.completed

continuous_improvement:
  deep_loop_required_for_promotion: true
  benchmark_before_after: true
  memory_regression_gate: true
  retrieval_quality_regression_gate: true
  lifecycle:
    - discover
    - assess
    - sandbox
    - benchmark
    - stage
    - approve
    - release
    - monitor
    - rollback
