# PEFY RAGFlow Ω controlled integration example.
# Do not place API keys, client data or real tenant identifiers in this file.

ragflow:
  admission_status: engineering_candidate
  reference_version: "0.27.1"
  endpoint: "https://ragflow.internal.example"
  api_key_env: "RAGFLOW_API_KEY"
  retrieval_path: "/api/v1/retrieval"

  phase_1:
    retrieval_only: true
    document_ingestion: controlled
    public_registration: false
    direct_public_api: false
    agent_code_execution: false
    unrestricted_browser_tools: false
    unrestricted_mcp_tools: false
    host_docker_socket: false

  retrieval:
    require_tenant: true
    allow_tenant_fallback_for_project: false
    max_chunks: 8
    max_chunk_chars: 4000
    page_size: 12
    similarity_threshold: 0.20
    vector_similarity_weight: 0.30
    top_k: 64
    timeout_seconds: 12

  dataset_mapping_examples:
    # Runtime mappings belong in the approved configuration/secret plane.
    # These placeholders demonstrate shape only.
    tenant_datasets:
      TENANT_PLACEHOLDER:
        - DATASET_PLACEHOLDER
    project_datasets:
      "TENANT_PLACEHOLDER/PROJECT_PLACEHOLDER":
        - PROJECT_DATASET_PLACEHOLDER

  hardening:
    pin_release_and_digest: true
    sbom_required: true
    vulnerability_scan_required: true
    secret_scan_required: true
    private_network: true
    tls_gateway: true
    least_privilege: true
    non_root_where_supported: true
    no_host_docker_socket: true
    sandbox_network_disabled_by_default: true
    egress_allowlist: true
    backup_restore_test_required: true
    upgrade_requalification_required: true
