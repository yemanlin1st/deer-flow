name: PEFY MƐTAFLOW Ω CI

on:
  push:
    branches:
      - "feature/pefy-metaflow-omega-*"
  pull_request:
    paths:
      - "backend/packages/harness/deerflow/pefy_omega/**"
      - "backend/tests/test_pefy_metaflow_*.py"
      - "config/pefy_metaflow_omega.example.yaml"
      - "rust/pefy-vector-rs/**"
      - "skills/public/pefy-metaflow-omega/**"
      - "docs/PEFY_METAFLOW_OMEGA*"
      - "docs/PEFY_OMEGA_MEMORY*"
      - "PEFY_UPSTREAM_NOTICE.md"
      - ".github/workflows/pefy-metaflow-ci.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Targeted policy / export / scheduling / memory tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile MƐTAFLOW Ω package
        run: python -m compileall -q backend/packages/harness/deerflow/pefy_omega

      - name: Run targeted tests
        env:
          PYTHONPATH: backend/packages/harness
        run: >-
          python -m pytest -q
          backend/tests/test_pefy_metaflow_omega.py
          backend/tests/test_pefy_metaflow_execution.py
          backend/tests/test_pefy_metaflow_memory.py

  omega-vector-rs:
    name: ΩVECTOR-RS build / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt,clippy

      - name: Format temporary working tree
        run: cargo +1.97.1 fmt --manifest-path rust/pefy-vector-rs/Cargo.toml

      - name: Clippy
        run: >-
          cargo +1.97.1 clippy
          --manifest-path rust/pefy-vector-rs/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Unit tests
        run: >-
          cargo +1.97.1 test
          --manifest-path rust/pefy-vector-rs/Cargo.toml
          --all-targets

      - name: Verify formatted Rust is committed
        run: git diff --exit-code -- rust/pefy-vector-rs
