name: PEFY MƐTAFLOW Ω CI

on:
  push:
    branches:
      - "feature/pefy-metaflow-omega-*"
  pull_request:
    paths:
      - "backend/packages/harness/deerflow/pefy_omega/**"
      - "backend/tests/test_pefy_metaflow_*.py"
      - "config/pefy_metaflow_omega.example.yaml"
      - "rust/pefy-vector-rs/**"
      - "skills/public/pefy-metaflow-omega/**"
      - "docs/PEFY_METAFLOW_OMEGA*"
      - "docs/PEFY_OMEGA_MEMORY*"
      - "PEFY_UPSTREAM_NOTICE.md"
      - ".github/workflows/pefy-metaflow-ci.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    name: Targeted policy / export / scheduling / memory / profile tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile MƐTAFLOW Ω package
        run: python -m compileall -q backend/packages/harness/deerflow/pefy_omega

      - name: Run targeted tests
        env:
          PYTHONPATH: backend/packages/harness
        run: >-
          python -m pytest -q
          backend/tests/test_pefy_metaflow_omega.py
          backend/tests/test_pefy_metaflow_execution.py
          backend/tests/test_pefy_metaflow_memory.py
          backend/tests/test_pefy_metaflow_vector_profiles.py

  omega-vector-rs:
    name: ΩVECTOR-RS build / lint / test / benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt,clippy

      - name: Format temporary working tree
        run: cargo +1.97.1 fmt --manifest-path rust/pefy-vector-rs/Cargo.toml

      - name: Clippy
        run: >-
          cargo +1.97.1 clippy
          --manifest-path rust/pefy-vector-rs/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Unit tests
        run: >-
          cargo +1.97.1 test
          --manifest-path rust/pefy-vector-rs/Cargo.toml
          --all-targets

      - name: Qualification smoke benchmark
        env:
          OMEGA_BENCH_VECTORS: "1024"
          OMEGA_BENCH_DIMENSIONS: "64"
          OMEGA_BENCH_QUERIES: "12"
          OMEGA_BENCH_K: "5"
          OMEGA_BENCH_MAX_NEIGHBORS: "12"
          OMEGA_BENCH_EF_CONSTRUCTION: "96"
          OMEGA_BENCH_EF_SEARCH: "80"
          OMEGA_BENCH_RERANK: "48"
          OMEGA_BENCH_QUERY_MEMORY_MB: "4"
        run: >-
          cargo +1.97.1 run --release
          --manifest-path rust/pefy-vector-rs/Cargo.toml
          --bin omega-vector-bench
          > omega-vector-benchmark.json

      - name: Validate benchmark JSON
        run: python -m json.tool omega-vector-benchmark.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: omega-vector-benchmark
          path: omega-vector-benchmark.json
          retention-days: 30

      - name: Verify formatted Rust is committed
        run: git diff --exit-code -- rust/pefy-vector-rs
