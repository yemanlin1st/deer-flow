name: PEFY RAGFlow Ω Adapter CI

on:
  push:
    branches:
      - "feature/pefy-ragflow-omega-adapter-*"
    paths:
      - "backend/packages/harness/deerflow/pefy_omega/ragflow_adapter.py"
      - "backend/packages/harness/deerflow/pefy_omega/__init__.py"
      - "backend/tests/test_pefy_ragflow_adapter.py"
      - "config/pefy_ragflow_omega.example.yaml"
      - "config/ragflow_upstream.lock.json"
      - "docs/PEFY_RAGFLOW_OMEGA_ADAPTER.md"
      - ".github/workflows/pefy-ragflow-adapter-ci.yml"
  pull_request:
    paths:
      - "backend/packages/harness/deerflow/pefy_omega/ragflow_adapter.py"
      - "backend/packages/harness/deerflow/pefy_omega/__init__.py"
      - "backend/tests/test_pefy_ragflow_adapter.py"
      - "config/pefy_ragflow_omega.example.yaml"
      - "config/ragflow_upstream.lock.json"
      - "docs/PEFY_RAGFLOW_OMEGA_ADAPTER.md"
      - ".github/workflows/pefy-ragflow-adapter-ci.yml"

permissions:
  contents: read

jobs:
  adapter-qualification:
    name: Adapter unit / scope / provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile PEFY Omega package
        run: python -m compileall -q backend/packages/harness/deerflow/pefy_omega

      - name: Validate upstream lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path("config/ragflow_upstream.lock.json").read_text())
          release = lock["release"]
          qualification = lock["qualification"]
          controls = lock["controls"]

          assert lock["schema"] == "pefy.ragflow.upstream-lock.v1"
          assert lock["repository"] == "infiniflow/ragflow"
          assert lock["license"] == "Apache-2.0"
          assert release["tag"].startswith("v")
          assert len(release["commit_sha"]) == 40
          int(release["commit_sha"], 16)
          assert release["commit_signature_verified"] is True
          assert qualification["production_approved"] is False
          assert qualification["upgrade_requires_requalification"] is True
          assert controls["container_digest_required_before_deploy"] is True
          assert controls["sbom_required_before_deploy"] is True
          assert controls["vulnerability_scan_required_before_deploy"] is True
          PY

      - name: Run RAGFlow adapter tests
        env:
          PYTHONPATH: backend/packages/harness
        run: >-
          python -m pytest -q
          backend/tests/test_pefy_ragflow_adapter.py
          --junitxml=pefy-ragflow-adapter-tests.xml

      - name: Emit qualification evidence
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("config/ragflow_upstream.lock.json").read_text())
          evidence = {
              "schema": "pefy.ragflow.adapter-qualification.v1",
              "commit": os.environ.get("GIT_SHA"),
              "upstream_tag": lock["release"]["tag"],
              "upstream_commit": lock["release"]["commit_sha"],
              "adapter_unit_scope_gate": True,
              "tenant_required_gate": True,
              "project_scope_no_implicit_tenant_fallback_gate": True,
              "post_retrieval_dataset_authorization_gate": True,
              "bounded_hydration_gate": True,
              "https_endpoint_gate": True,
              "production_claim": False,
              "next_gate": "live-pinned-ragflow-integration",
          }
          Path("pefy-ragflow-adapter-qualification.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Validate qualification evidence
        run: python -m json.tool pefy-ragflow-adapter-qualification.json

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: pefy-ragflow-adapter-qualification
          path: |
            pefy-ragflow-adapter-qualification.json
            pefy-ragflow-adapter-tests.xml
          retention-days: 30
