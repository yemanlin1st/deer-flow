[package]
name = "pefy-vector-compact-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"
publish = false
description = "PEFY ΩVECTOR-RS Compact q8-only mmap vector index for NANO/EDGE runtimes"

[lib]
name = "pefy_vector_compact_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
memmap2 = "=0.9.11"
thiserror = "=2.0.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
debug = 1
