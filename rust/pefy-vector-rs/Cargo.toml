[package]
name = "pefy-vector-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Proprietary"
publish = false
description = "PEFY ΩVECTOR-RS low-memory mmap-backed vector index for MƐTAFLOW Ω / MƐTAPEFYON Ω"

[lib]
name = "pefy_vector_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
half = "2"
memmap2 = "0.9"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
debug = 1
